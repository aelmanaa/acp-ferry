packages:
  - packages/*

linkWorkspacePackages: true

# CI runs `pnpm dedupe --check`; autoDedupe keeps `pnpm install` from writing a lockfile it refuses.
autoDedupe: true
lockfile:
  includeResolutionSettings: true

# Install scripts of dependencies do not run unless listed here. lefthook's only runs
# `lefthook install`, which `prepare` does.
allowBuilds:
  lefthook: false

# Versions shared by every package: the development tools (same versions as explorer-verify on
# 2026-11-05) and the runtime dependencies. Dependabot moves them from here.
catalog:
  "@agentclientprotocol/sdk": "2.1.0"
  "@arethetypeswrong/cli": "0.18.5"
  "@changesets/changelog-github": "1.0.1"
  "@changesets/cli": "3.0.3"
  "@types/node": "^22.18.0"
  "ajv": "8.20.0"
  "ajv-formats": "3.0.1"
  "c8": "12.0.0"
  "eslint-plugin-jsdoc": "65.4.3"
  "knip": "6.44.1"
  "lefthook": "2.2.2"
  "oxfmt": "0.76.0"
  "oxlint": "1.91.0"
  "oxlint-tsgolint": "7.0.2005"
  "publint": "0.3.25"
  "typescript": "7.0.2"
  "zod": "4.6.7"
